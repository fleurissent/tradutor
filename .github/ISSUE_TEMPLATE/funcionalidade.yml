name: Funcionalidade
description: Proponha uma nova funcionalidade ou melhoria
title: 'feat: '
labels: ['funcionalidade']
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual necessidade do usuario isto atende?
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] O usuário consegue...
        - [ ] O app impede...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [tela de tradução, lista de palavras, leitura em voz (TTS), pipeline/infra]
    validations:
      required: true
