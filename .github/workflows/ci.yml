name: CI

# Integracao Continua do app Tradutor de Palavras (Flutter).
# Todo push e todo Pull Request para a branch principal dispara o pipeline.
# Nenhuma mudanca deve ser integrada sem o pipeline verde (quality gate).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, analise e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Flutter (com cache)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restaurar dependencias
        run: flutter pub get

      - name: Verificar formatacao
        run: dart format --output=none --set-exit-if-changed .

      - name: Analise estatica (lint)
        run: flutter analyze

      - name: Testes unitarios / de widget (com cobertura)
        run: flutter test --coverage

      - name: Publicar relatorio de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Build do APK (artefato versionado)
        run: flutter build apk --release

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: tradutor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
